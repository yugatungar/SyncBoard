spring.application.name=syncboard-backend
server.port=${PORT:8080}

# Database Configuration (Defaults to H2 for zero-setup; override DB_URL for PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:syncboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis Configuration (Configurable via REDIS_HOST / REDIS_PORT)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Redis Channel Names
syncboard.redis.workspace-channel=syncboard:workspace-events
syncboard.redis.presence-channel=syncboard:presence-events

# JWT Security Configuration
jwt.secret=${JWT_SECRET:syncboard-super-secret-key-that-is-at-least-32-bytes-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring Boot Actuator Monitoring & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Structured Logging Levels
logging.level.com.syncboard.backend=INFO
logging.level.org.springframework.security=WARN
