version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncboard-postgres
    environment:
      POSTGRES_DB: syncboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: syncboard_secret_pass
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syncboard-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: syncboard-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/syncboard
      DB_USERNAME: postgres
      DB_PASSWORD: syncboard_secret_pass
      DB_DRIVER: org.postgresql.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: syncboard-super-secret-key-that-is-at-least-32-bytes-long
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build: ./frontend
    container_name: syncboard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
